name: Bug report
description: Something in Deepcus is broken or behaves wrong
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Deepcus version
      description: Settings, bottom of the page
      placeholder: "1.1.1"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: shots
    attributes:
      label: Screenshots
      description: Optional. Drag images here.
